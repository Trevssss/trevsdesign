<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Thank You | TREVS DESIGN</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #090d16;
      --surface: #101726;
      --surface-border: rgba(255, 255, 255, 0.1);
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --cyan: #f97316;
      --cyan-glow: rgba(249, 115, 22, 0.35);
      --lime-neon: #a3e635;
      --grad-primary: linear-gradient(135deg, #d97706 0%, #c2410c 55%, #7c2d12 100%);
      --mono: "DM Mono", monospace;
      --sans: "Manrope", sans-serif;
      --radius-pill: 9999px;
      --radius-card: 26px;
    }
    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      margin: 0;
      color: var(--text);
      background: var(--bg);
      font-family: var(--sans);
      background-image: 
        radial-gradient(circle at 50% 20%, rgba(217, 119, 6, 0.18) 0%, transparent 55%),
        radial-gradient(circle at 80% 80%, rgba(194, 65, 12, 0.12) 0%, transparent 50%);
    }
    .thank-you {
      width: min(620px, calc(100% - 36px));
      padding: 56px 40px;
      text-align: center;
      background: var(--surface);
      border: 1px solid var(--surface-border);
      border-radius: var(--radius-card);
      box-shadow: 0 30px 80px rgba(0,0,0,0.6);
      position: relative;
    }
    .thank-you:before {
      content: "";
      position: absolute;
      top: 0;
      left: 15%;
      right: 15%;
      height: 2px;
      background: var(--grad-primary);
      border-radius: var(--radius-pill);
    }
    .check {
      display: inline-grid;
      width: 72px;
      height: 72px;
      place-items: center;
      margin-bottom: 24px;
      color: white;
      background: var(--grad-primary);
      border-radius: var(--radius-pill);
      font-size: 36px;
      font-weight: 900;
      box-shadow: 0 10px 30px var(--cyan-glow);
    }
    .eyebrow {
      margin: 0 0 16px;
      color: var(--cyan);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .16em;
      text-transform: uppercase;
      font-family: var(--mono);
    }
    h1 {
      margin: 0 0 20px;
      font-size: clamp(34px, 6vw, 54px);
      line-height: .96;
      letter-spacing: -.05em;
      font-weight: 900;
    }
    p {
      color: var(--text-muted);
      line-height: 1.75;
      font-size: 15px;
      margin: 0 0 28px;
    }
    .home {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 16px 30px;
      color: white;
      background: var(--grad-primary);
      border-radius: var(--radius-pill);
      font-size: 14px;
      font-weight: 800;
      text-decoration: none;
      box-shadow: 0 8px 25px var(--cyan-glow);
      transition: transform .3s ease;
    }
    .home:hover { transform: translateY(-2px); }
  </style>
</head>
<body>
  <main class="thank-you">
    <div class="check" aria-hidden="true">✓</div>
    <p class="eyebrow">TREVS DESIGN TEAM / VERIFICATION PENDING</p>
    <h1>Payment claim received.</h1>
    <p>Your payment claim has been sent to <strong>TREVS DESIGN TEAM</strong> for manual verification. Payment is not confirmed until the team checks the transfer, and project work will begin after confirmation.</p>
    <a class="home" href="index.html">Return to homepage -&gt;</a>
  </main>
</body>
</html>
